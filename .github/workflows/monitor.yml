name: Refresh monitors and publish Pages

'on':
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'monitor_core/**'
      - 'monitors/**'
      - 'scripts/**'
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/monitor.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('monitor-pr-{0}', github.event.pull_request.number) || 'monitor' }}
  cancel-in-progress: false

env:
  STOP_DATE: ${{ vars.STOP_DATE || '2027-01-01' }}

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Run offline tests and fixture builds
        run: |
          python -m unittest discover -s tests
          python scripts/run.py --monitor ozbargain --fixtures
          python scripts/run.py --monitor hackernews --fixtures
          node tests/frontend_smoke.js site

  guard:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.stop.outputs.proceed }}
    steps:
      - name: Stop scheduled runs after the Sydney stop date
        id: stop
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          today = datetime.now(ZoneInfo('Australia/Sydney')).date().isoformat()
          stopped = os.environ['EVENT_NAME'] == 'schedule' and today >= os.environ['STOP_DATE']
          if stopped:
              print('::notice::Scheduled refresh stopped at STOP_DATE; manual dispatch remains available.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('proceed=' + str(not stopped).lower() + '\n')
          PY

  publish:
    permissions:
      contents: write
      pages: write
      id-token: write
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment-retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check out state branch or create orphan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin state > /dev/null; then
            git fetch --depth=1 origin state
            git worktree add -B state ./state FETCH_HEAD
          else
            result=$?
            if [ "$result" -ne 2 ]; then
              echo 'State branch lookup failed; refusing to recreate existing state.' >&2
              exit "$result"
            fi
            git worktree add --detach ./state HEAD
            git -C state switch --orphan state
          fi
      - name: Run offline tests
        run: python -m unittest discover -s tests
      - name: Run both monitors with previous-data fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p generated/data state/ozbargain state/hackernews
          if [ -d state/data ]; then cp -a state/data/. generated/data/; fi
          for monitor in ozbargain hackernews; do
            python scripts/run.py --monitor "$monitor" --state-dir "state/$monitor" --out generated || python scripts/fallback.py --monitor "$monitor" --out generated
          done
      - name: Recheck Europe offers when due
        run: |
          python scripts/run_europe.py --out generated || python scripts/run_europe.py --out generated --fallback
      - name: Assemble site and persist publication fallback
        run: |
          mkdir -p _site state/data
          cp -a site/. _site/
          cp -a generated/data _site/
          cp -a generated/data/. state/data/
      - name: Keep a single amended state commit
        run: |
          git -C state add ozbargain hackernews data
          if ! git -C state diff --cached --quiet; then
            if git -C state rev-parse --verify HEAD > /dev/null 2>&1; then
              git -C state commit --amend --no-edit
            else
              git -C state commit -m 'Update monitor state'
            fi
            git -C state push --force origin HEAD:state
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Deploy Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact metadata
        if: steps.deployment.outcome == 'failure' && !steps.deployment.outputs.page_url
        run: sleep 20
      - name: Retry Pages deployment once
        id: deployment-retry
        if: steps.deployment.outcome == 'failure' && !steps.deployment.outputs.page_url
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Preserve deployment failure after Pages accepted it
        if: steps.deployment.outcome == 'failure' && steps.deployment.outputs.page_url
        run: exit 1
